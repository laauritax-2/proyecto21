<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temporizador Pomodoro</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="contenedor">
        <h1>Temporizador Pomodoro</h1>
        <p class="descripcion">Organiza tu tiempo y toma descansos.</p>

        <section class="temporizador">
            <div class="tipos">
                <button type="button" class="tipo activo" data-tipo="trabajo">Trabajo</button>
                <button type="button" class="tipo" data-tipo="corta">Descanso corto</button>
                <button type="button" class="tipo" data-tipo="larga">Descanso largo</button>
            </div>

            <h2 id="nombre-sesion">Tiempo de trabajo</h2>
            <p id="reloj" aria-live="off">25:00</p>

            <div class="botones">
                <button type="button" id="iniciar">Iniciar</button>
                <button type="button" id="reiniciar">Reiniciar</button>
                <button type="button" id="siguiente">Siguiente</button>
            </div>

            <p id="mensaje" role="status">¡Tú puedes! Concéntrate en una tarea.</p>
        </section>
        <section class="configuracion">
            <h2>Configurar tiempos</h2>
            <form id="formulario">
                <label for="min-trabajo">Trabajo (minutos):</label>
                <input type="number" id="min-trabajo" min="1" max="180" value="25" required>

                <label for="min-corta">Descanso corto (minutos):</label>
                <input type="number" id="min-corta" min="1" max="60" value="5" required>

                <label for="min-larga">Descanso largo (minutos):</label>
                <input type="number" id="min-larga" min="1" max="90" value="15" required>

                <button type="submit">Guardar tiempos</button>
            </form>
            <p id="aviso-configuracion" role="status"></p>
        </section>
    </main>
</body>
</html>
